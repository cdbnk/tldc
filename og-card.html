<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px; height: 630px; overflow: hidden;
  background: #06060e;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: 'Outfit', sans-serif;
  position: relative;
}
body::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, #06060e 0%, #0c0808 40%, #0e0608 70%, #06060e 100%);
}
body::after {
  content: ''; position: absolute;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 500px; height: 500px;
  background: radial-gradient(circle, #7a203018 0%, #a8324010 40%, transparent 70%);
}
.content { position: relative; z-index: 1; text-align: center; }
.badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
  color: #cf6b63; border: 1px solid #a8324040;
  padding: 6px 20px; border-radius: 20px; display: inline-block;
  margin-bottom: 36px;
}
h1 {
  font-size: 140px; font-weight: 900; letter-spacing: -6px; line-height: 0.85;
  background: linear-gradient(90deg, #cf6b63, #bf5a52, #a83240, #c44230, #d4745a, #bf5a52);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 16px;
}
.subtitle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px; color: #5e5c78; letter-spacing: 6px; text-transform: uppercase;
  margin-bottom: 48px;
}
.tagline {
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 22px; color: #8f8daa; font-style: italic; max-width: 560px;
  line-height: 1.5;
}
.version {
  position: absolute; bottom: 32px; right: 40px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: #5e5c78; letter-spacing: 1px;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@900&family=Source+Serif+4:ital@1&display=swap" rel="stylesheet">
</head>
<body>
<div class="content">
  <div class="badge">Language Specification v0.2.0</div>
  <h1>$TLDC</h1>
  <div class="subtitle">Too Long; Didn't Code</div>
  <p class="tagline" style="margin-bottom:20px">The first A.I.-native programming language built for the decentralized post-authorship era.</p>
  <p style="font-family:'Outfit',sans-serif;font-size:28px;font-weight:900;color:#f0eefa;line-height:1.4">The developer's role is not to write code.<br><span style="background:linear-gradient(90deg,#cf6b63,#a83240,#c44230);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-style:italic">It is to believe in it.</span></p>
</div>
<div class="version">v0.2.0 &middot; June 2026</div>
</body>
</html>
